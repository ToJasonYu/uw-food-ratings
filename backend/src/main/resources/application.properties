spring.application.name=uw-food-ratings

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/uwfoodratings}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.jwt.secret=${JWT_SECRET:dev-only-signing-key-change-this-before-any-real-deployment-min-32-bytes}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
